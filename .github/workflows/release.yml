# Read-only build-once pipeline; native jobs consume the exact same archives.
name: Release plugin
on:
  workflow_call:
    inputs:
      helper_repository:
        type: string
        required: true
      helper_commit:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pipeline.yml
    with:
      helper_repository: ${{ inputs.helper_repository }}
      helper_commit: ${{ inputs.helper_commit }}
  publish:
    needs: aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.helper_repository }}
          ref: ${{ inputs.helper_commit }}
          path: helper
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accepted-release
          path: accepted
      - run: node --experimental-strip-types helper/scripts/publish.mts accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
